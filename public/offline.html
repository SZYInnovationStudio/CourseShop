<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>网络连接不可用 - CourseShop</title>
    <style>
        :root { --color-primary: #4F6F52; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: #f6f7f5;
        }
        .offline-card {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        .offline-card__icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(79, 111, 82, 0.12);
            color: var(--color-primary);
            font-size: 30px;
            line-height: 1;
        }
        h1 { margin: 0 0 12px; font-size: 20px; }
        p { margin: 0 0 24px; font-size: 14px; line-height: 1.7; color: #6b7280; }
        .offline-card__btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 15px;
            color: #ffffff;
            text-decoration: none;
            background: var(--color-primary);
            border-radius: 10px;
        }
        .offline-card__btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-card__icon">!</div>
        <h1>网络连接不可用</h1>
        <p>当前设备似乎已离线，请检查网络后再试。<br>已浏览过的页面可能仍可访问。</p>
        <a class="offline-card__btn" href="./">重新加载</a>
    </div>
</body>
</html>
