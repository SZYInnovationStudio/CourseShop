<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="窗边书桌上的书与咖啡">
  <rect width="900" height="600" fill="#F7EFE0"/>

  <!-- 拱窗 -->
  <path d="M110 600V300a150 150 0 0 1 300 0v300Z" fill="#8CA08A"/>
  <path d="M132 600V308a128 128 0 0 1 256 0v292" fill="none" stroke="#F7EFE0" stroke-width="3" opacity="0.4"/>
  <circle cx="260" cy="286" r="58" fill="#EDC079"/>

  <!-- 桌面 -->
  <rect y="470" width="900" height="130" fill="#E4D3B5"/>
  <path d="M0 470h900" stroke="#D3BE99" stroke-width="2.5"/>

  <ellipse cx="620" cy="474" rx="132" ry="8" fill="#C9B394" opacity="0.28"/>

  <!-- 摊开的书 -->
  <g>
    <rect x="490" y="278" width="260" height="192" rx="3" fill="#C4704F"/>
    <rect x="498" y="278" width="122" height="184" fill="#FFFDF6"/>
    <rect x="620" y="278" width="122" height="184" fill="#FFFDF6"/>
    <path d="M620 278V462" stroke="#E0D0B4" stroke-width="2.4"/>
    <path d="M516 306H572" stroke="#C4704F" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M668 306H724" stroke="#C4704F" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <g stroke="#DFD0B6" stroke-width="3.4" stroke-linecap="round">
      <path d="M516 330H608M516 352H592M516 374H608M516 396H586M516 418H600M516 440H572"/>
      <path d="M632 330H724M648 352H724M632 374H724M654 396H724M640 418H724M668 440H724"/>
    </g>
  </g>

  <!-- 咖啡 -->
  <g>
    <ellipse cx="806" cy="470" rx="42" ry="8" fill="#E3D3B6"/>
    <path d="M776 408h60v34a30 30 0 0 1-60 0Z" fill="#FFFDF6"/>
    <path d="M836 416c19 0 19 26 0 26" fill="none" stroke="#DCC9A8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="806" cy="408" rx="30" ry="7" fill="#F4E9D4" stroke="#E3D3B6" stroke-width="2"/>
    <g stroke="#D8C6A8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M796 392c6-9 6-15 0-23M816 392c6-9 6-15 0-23"/>
    </g>
  </g>

  <!-- 铅笔 -->
  <g transform="rotate(-9 512 528)">
    <ellipse cx="512" cy="540" rx="96" ry="7" fill="#C9B394" opacity="0.32"/>
    <rect x="424" y="516" width="150" height="17" rx="4" fill="#C4704F"/>
    <path d="M424 516l-24 8.5 24 8.5Z" fill="#EBD5AE"/>
    <path d="M411 520.6L400 524.5l11 3.9Z" fill="#102956"/>
    <rect x="564" y="516" width="14" height="17" rx="4" fill="#E2BB84"/>
  </g>
</svg>
