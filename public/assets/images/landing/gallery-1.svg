<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="窗边书桌上的书与咖啡">
  <defs>
    <linearGradient id="g1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F1E5D0"/>
    </linearGradient>
    <linearGradient id="g1arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3B39C"/>
      <stop offset="1" stop-color="#84977F"/>
    </linearGradient>
    <radialGradient id="g1sun" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#F9E6BC"/>
      <stop offset="0.55" stop-color="#EEC47F"/>
      <stop offset="1" stop-color="#DFA066"/>
    </radialGradient>
    <linearGradient id="g1table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D9BC"/>
      <stop offset="1" stop-color="#DCC8A4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#g1bg)"/>

  <!-- 拱窗 -->
  <path d="M110 600V300a150 150 0 0 1 300 0v300Z" fill="url(#g1arch)"/>
  <path d="M132 600V308a128 128 0 0 1 256 0v292" fill="none"
        stroke="#FBF6EC" stroke-width="3" opacity="0.35"/>
  <circle cx="260" cy="286" r="62" fill="url(#g1sun)"/>

  <!-- 桌面 -->
  <rect y="470" width="900" height="130" fill="url(#g1table)"/>
  <path d="M0 470h900" stroke="#D3BE99" stroke-width="2.5"/>

  <ellipse cx="620" cy="476" rx="142" ry="9" fill="#C9B394" opacity="0.3"/>

  <!-- 摊开的书：平放，封面在下、书页在上 -->
  <g>
    <path d="M620 371C570 368 516 372 470 377V470H770V377C724 372 670 368 620 371Z" fill="#C4704F"/>
    <path d="M620 376C570 373 516 377 480 382V462H620Z" fill="#FFFDF6"/>
    <path d="M620 376C670 373 724 377 760 382V462H620Z" fill="#FFFDF6"/>
    <path d="M620 376V462" stroke="#DCCDAF" stroke-width="2.6"/>
    <g stroke="#DFD0B6" stroke-width="3" stroke-linecap="round">
      <path d="M500 404H602M500 421H586M500 438H564"/>
      <path d="M638 404H740M654 421H740M676 438H740"/>
    </g>
    <path d="M500 392H556" stroke="#C4704F" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M684 392H740" stroke="#C4704F" stroke-width="5" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- 咖啡 -->
  <g>
    <ellipse cx="806" cy="470" rx="42" ry="8" fill="#E3D3B6"/>
    <path d="M776 408h60v34a30 30 0 0 1-60 0Z" fill="#FFFDF6"/>
    <path d="M836 416c19 0 19 26 0 26" fill="none" stroke="#DCC9A8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="806" cy="408" rx="30" ry="7" fill="#F4E9D4" stroke="#E3D3B6" stroke-width="2"/>
    <g stroke="#D8C6A8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M796 392c6-9 6-15 0-23M816 392c6-9 6-15 0-23"/>
    </g>
  </g>

  <!-- 铅笔 -->
  <g transform="rotate(-9 512 528)">
    <ellipse cx="512" cy="540" rx="96" ry="7" fill="#C9B394" opacity="0.35"/>
    <rect x="424" y="516" width="150" height="17" rx="4" fill="#C4704F"/>
    <path d="M424 516l-24 8.5 24 8.5Z" fill="#EBD5AE"/>
    <path d="M411 520.6L400 524.5l11 3.9Z" fill="#102956"/>
    <rect x="564" y="516" width="14" height="17" rx="4" fill="#E2BB84"/>
  </g>
</svg>
