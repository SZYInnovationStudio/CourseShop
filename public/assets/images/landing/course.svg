<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="课程目录界面与咖啡、绿植插画">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F0E3CD"/>
    </linearGradient>
    <linearGradient id="cArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98E6C"/>
      <stop offset="1" stop-color="#B36E4E"/>
    </linearGradient>
    <linearGradient id="cTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D9BC"/>
      <stop offset="1" stop-color="#D9C49F"/>
    </linearGradient>
    <linearGradient id="cCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CE7B56"/>
      <stop offset="1" stop-color="#B35F3D"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#cBg)"/>

  <!-- 背景柔光圆 -->
  <circle cx="706" cy="238" r="212" fill="#EBDCBF" opacity="0.55"/>

  <!-- 桌面 -->
  <rect y="500" width="900" height="100" fill="url(#cTable)"/>
  <path d="M0 500h900" stroke="#D3BE99" stroke-width="2.5"/>

  <ellipse cx="800" cy="502" rx="44" ry="8" fill="#C9B394" opacity="0.4"/>
  <ellipse cx="98" cy="566" rx="54" ry="9" fill="#C9B394" opacity="0.32"/>

  <!-- 课程窗口 -->
  <rect x="158" y="104" width="550" height="374" rx="14" fill="#C9B394" opacity="0.16"/>
  <rect x="150" y="96" width="550" height="374" rx="14" fill="#FFFDF6"/>

  <circle cx="178" cy="119" r="5" fill="#C4704F"/>
  <circle cx="196" cy="119" r="5" fill="#D9A441"/>
  <circle cx="214" cy="119" r="5" fill="#8A9B85"/>
  <rect x="544" y="113" width="120" height="12" rx="6" fill="#EFE4CE"/>

  <!-- 封面 -->
  <rect x="186" y="156" width="196" height="136" rx="9" fill="url(#cCover)"/>
  <path d="M186 258h196v25a9 9 0 0 1-9 9H195a9 9 0 0 1-9-9Z" fill="#A9522F" opacity="0.5"/>
  <circle cx="284" cy="221" r="27" fill="#FFFDF6" opacity="0.94"/>
  <path d="M277 209l19 12-19 12Z" fill="#B35F3D"/>

  <!-- 右侧信息 -->
  <rect x="406" y="162" width="230" height="12" rx="6" fill="#102956"/>
  <rect x="406" y="188" width="196" height="7" rx="3" fill="#DFD0B6"/>
  <rect x="406" y="206" width="146" height="7" rx="3" fill="#DFD0B6"/>
  <rect x="406" y="232" width="252" height="11" rx="5" fill="#EFE4CE"/>
  <rect x="406" y="232" width="142" height="11" rx="5" fill="#8A9B85"/>
  <rect x="406" y="258" width="96" height="11" rx="5" fill="#EFE4CE"/>

  <!-- 章节列表 -->
  <g>
    <rect x="186" y="322" width="478" height="30" rx="7" fill="#F5EDDD"/>
    <circle cx="208" cy="337" r="6" fill="#8A9B85"/>
    <rect x="228" y="333" width="196" height="8" rx="4" fill="#E2D3B8"/>
    <rect x="576" y="333" width="66" height="8" rx="4" fill="#E2D3B8"/>

    <rect x="186" y="362" width="478" height="30" rx="7" fill="#F5EDDD"/>
    <circle cx="208" cy="377" r="6" fill="#D9A441"/>
    <rect x="228" y="373" width="228" height="8" rx="4" fill="#E2D3B8"/>
    <rect x="576" y="373" width="66" height="8" rx="4" fill="#E2D3B8"/>

    <rect x="186" y="402" width="478" height="30" rx="7" fill="#F5EDDD"/>
    <circle cx="208" cy="417" r="6" fill="#C4704F"/>
    <rect x="228" y="413" width="168" height="8" rx="4" fill="#E2D3B8"/>
    <rect x="576" y="413" width="66" height="8" rx="4" fill="#E2D3B8"/>
  </g>

  <!-- 咖啡 -->
  <g>
    <ellipse cx="800" cy="500" rx="42" ry="8" fill="#E3D3B6"/>
    <path d="M770 438h60v32a30 30 0 0 1-60 0Z" fill="#FFFDF6"/>
    <path d="M830 445c18 0 18 25 0 25" fill="none" stroke="#DCC9A8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="800" cy="438" rx="30" ry="7" fill="#F4E9D4" stroke="#E3D3B6" stroke-width="2"/>
    <g stroke="#D8C6A8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M790 422c6-9 6-15 0-23M810 422c6-9 6-15 0-23"/>
    </g>
  </g>

  <!-- 绿植 -->
  <g>
    <path d="M70 500h60l-9 64h-42Z" fill="#C4704F"/>
    <rect x="64" y="494" width="72" height="13" rx="5" fill="#B4633F"/>
    <ellipse cx="100" cy="500" rx="27" ry="5" fill="#8A5B3E"/>
    <path d="M100 500v-92" stroke="#546B58" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 470c-34-4-52-30-44-52 26 6 44 28 44 52Z" fill="#7C9078"/>
    <path d="M100 444c34-4 52-30 44-52-26 6-44 28-44 52Z" fill="#8A9B85"/>
    <path d="M100 424c-26-6-39-26-31-43 20 5 31 22 31 43Z" fill="#8A9B85"/>
    <path d="M100 402c26-6 39-26 31-43-20 5-31 22-31 43Z" fill="#7C9078"/>
