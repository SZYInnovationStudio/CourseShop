  </g>

  <!-- 铅笔 -->
  <g transform="rotate(32 600 520)">
    <rect x="512" y="512" width="150" height="16" rx="4" fill="#C4704F"/>
    <path d="M512 512l-28 8 28 8Z" fill="#F7F0E2"/>
    <path d="M492 518l10-4 10 4-10 4Z" fill="#102956"/>
    <rect x="650" y="512" width="14" height="16" rx="4" fill="#8A9B85"/>
