<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="笔记与几何图形插画">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFBF4"/>
      <stop offset="1" stop-color="#F7F0E2"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="#F1EEE6"/>
  <circle cx="694" cy="196" r="168" fill="#E7DDC9" opacity="0.75"/>

  <!-- 太阳弧 -->
  <circle cx="694" cy="196" r="62" fill="#D9A441" opacity="0.9"/>
  <circle cx="694" cy="196" r="96" fill="none" stroke="#102956" stroke-width="2.4" opacity="0.28"/>

  <!-- 笔记本 -->
  <g transform="rotate(-6 450 300)">
    <rect x="278" y="150" width="312" height="396" rx="12" fill="#E4D6BF" opacity="0.6"/>
    <rect x="262" y="136" width="312" height="396" rx="12" fill="url(#paper)" stroke="#E0D2BC" stroke-width="3"/>
    <path d="M300 136v396" stroke="#E6D8C2" stroke-width="3"/>
    <g fill="#C9A274">
      <circle cx="286" cy="172" r="5"/><circle cx="286" cy="210" r="5"/>
      <circle cx="286" cy="248" r="5"/><circle cx="286" cy="286" r="5"/>
      <circle cx="286" cy="324" r="5"/><circle cx="286" cy="362" r="5"/>
      <circle cx="286" cy="400" r="5"/><circle cx="286" cy="438" r="5"/>
    </g>

    <path d="M330 194h186" stroke="#102956" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
    <path d="M330 220h118" stroke="#C4704F" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <g stroke="#C6B69C" stroke-width="3.6" stroke-linecap="round">
      <path d="M330 262h204M330 288h188M330 314h204M330 340h146"/>
      <path d="M330 384h204M330 410h172M330 436h196M330 462h128"/>
    </g>

    <!-- 便签 -->
    <g transform="rotate(7 520 420)">
      <rect x="452" y="368" width="112" height="104" rx="6" fill="#E8C98B"/>
      <path d="M452 420h112M452 444h84" stroke="#C4704F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M564 368v26h-26" fill="#D9B36C"/>
