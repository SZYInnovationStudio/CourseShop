  <!-- 几何点缀 -->
  <circle cx="700" cy="452" r="54" fill="#8A9B85" opacity="0.9"/>
  <path d="M666 452h68" stroke="#F1EEE6" stroke-width="3" opacity="0.6"/>

  <g transform="rotate(12 150 170)">
    <rect x="118" y="138" width="64" height="64" rx="4" fill="none" stroke="#102956" stroke-width="4" opacity="0.55"/>
  </g>

  <path d="M118 540h250" stroke="#102956" stroke-width="3" opacity="0.35"/>
  <g stroke="#102956" stroke-width="2.4" opacity="0.35">
    <path d="M140 534v12M172 534v8M204 534v12M236 534v8M268 534v12M300 534v8M332 534v12"/>
