<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="耳机与声波插画">
  <defs>
    <linearGradient id="g3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F2E7D3"/>
    </linearGradient>
    <linearGradient id="g3cupL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CE7B56"/>
      <stop offset="1" stop-color="#B35F3D"/>
    </linearGradient>
    <linearGradient id="g3cupR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A88D"/>
      <stop offset="1" stop-color="#7A9074"/>
    </linearGradient>
    <linearGradient id="g3band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3766"/>
      <stop offset="1" stop-color="#102956"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#g3bg)"/>
  <circle cx="450" cy="300" r="206" fill="#EEDFC6" opacity="0.5"/>

  <!-- 声波 -->
  <g fill="none" stroke="#C9B8A2" stroke-linecap="round">
    <path d="M212 398a54 54 0 0 0 0 84" stroke-width="4"/>
    <path d="M190 376a82 82 0 0 0 0 128" stroke-width="3.4" opacity="0.6"/>
    <path d="M688 398a54 54 0 0 1 0 84" stroke-width="4"/>
    <path d="M710 376a82 82 0 0 1 0 128" stroke-width="3.4" opacity="0.6"/>
  </g>

  <!-- 耳罩阴影 -->
  <ellipse cx="280" cy="496" rx="58" ry="10" fill="#C9B394" opacity="0.35"/>
  <ellipse cx="620" cy="496" rx="58" ry="10" fill="#C9B394" opacity="0.35"/>

  <!-- 头梁 -->
  <path d="M280 378C280 186 620 186 620 378" fill="none" stroke="url(#g3band)"
        stroke-width="30" stroke-linecap="round"/>

  <!-- 左右耳罩 -->
  <rect x="240" y="356" width="80" height="136" rx="38" fill="url(#g3cupL)"/>
  <rect x="258" y="374" width="44" height="100" rx="22" fill="#A9522F" opacity="0.55"/>
  <rect x="580" y="356" width="80" height="136" rx="38" fill="url(#g3cupR)"/>
  <rect x="598" y="374" width="44" height="100" rx="22" fill="#6B8267" opacity="0.5"/>

  <path d="M252 372c8-8 22-12 36-12" fill="none" stroke="#FBF6EC" stroke-width="4"
        stroke-linecap="round" opacity="0.25"/>
  <path d="M592 372c8-8 22-12 36-12" fill="none" stroke="#FBF6EC" stroke-width="4"
        stroke-linecap="round" opacity="0.25"/>
</svg>
