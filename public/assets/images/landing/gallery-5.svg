      <ellipse cx="486" cy="280" rx="30" ry="12" transform="rotate(38 486 280)"/>
      <ellipse cx="452" cy="256" rx="28" ry="11" transform="rotate(-4 452 256)"/>
      <ellipse cx="440" cy="304" rx="26" ry="10" transform="rotate(-24 440 304)"/>
      <ellipse cx="472" cy="310" rx="24" ry="9" transform="rotate(22 472 310)"/>
    </g>
    <path d="M452 344v-56M424 332c-12-14-16-26-12-38M480 332c12-14 16-26 12-38" fill="none" stroke="#5F7261" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- 点缀 -->
  <circle cx="172" cy="212" r="8" fill="#C4704F"/>
  <circle cx="748" cy="372" r="7" fill="#5F7261"/>
  <path d="M128 190h70M128 214h44" stroke="#102956" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
