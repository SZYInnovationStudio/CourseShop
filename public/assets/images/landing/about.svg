<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="晨光下的层叠山峦插画">
  <defs>
    <linearGradient id="aSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8EF"/>
      <stop offset="0.45" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EFDCC0"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2C583" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#EFBE7C" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#EFBE7C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aSun" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#F8E5B8"/>
      <stop offset="0.55" stop-color="#EDC27C"/>
      <stop offset="1" stop-color="#DE9E63"/>
    </radialGradient>
    <linearGradient id="aFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5DDDA"/>
      <stop offset="1" stop-color="#C8D4CF"/>
    </linearGradient>
    <linearGradient id="aMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0C3B8"/>
      <stop offset="1" stop-color="#9FB5A8"/>
    </linearGradient>
    <linearGradient id="aNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CA294"/>
      <stop offset="1" stop-color="#6E8878"/>
    </linearGradient>
    <filter id="aBlur" x="-40%" y="-220%" width="180%" height="540%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#aSky)"/>

  <!-- 晨光：太阳完整落在头图可见带内 -->
  <circle cx="1148" cy="352" r="300" fill="url(#aGlow)"/>
  <circle cx="1148" cy="352" r="94" fill="url(#aSun)"/>

  <!-- 云 -->
  <g fill="#FFFFFF" filter="url(#aBlur)">
    <ellipse cx="372" cy="272" rx="188" ry="15" opacity="0.5"/>
    <ellipse cx="288" cy="308" rx="110" ry="10" opacity="0.3"/>
    <ellipse cx="906" cy="228" rx="126" ry="11" opacity="0.28"/>
  </g>

  <!-- 远山 -->
  <path d="M0 556 C 168 470 330 464 486 534 C 626 596 748 482 908 474
           C 1064 466 1170 546 1320 546 C 1440 546 1520 496 1600 502 L1600 900 L0 900 Z"
        fill="url(#aFar)" opacity="0.7"/>

  <!-- 中山 -->
  <path d="M0 590 C 190 552 344 544 488 582 C 636 622 780 556 922 552
           C 1066 548 1192 594 1356 580 C 1452 572 1530 570 1600 568 L1600 900 L0 900 Z"
        fill="url(#aMid)" opacity="0.92"/>

  <!-- 近山 -->
  <path d="M0 632 C 204 610 380 602 566 622 C 756 642 972 604 1176 610
           C 1358 616 1484 606 1600 610 L1600 900 L0 900 Z" fill="url(#aNear)"/>

  <!-- 山脚薄雾 -->
  <g fill="#FFFFFF" filter="url(#aBlur)">
    <ellipse cx="436" cy="600" rx="320" ry="14" opacity="0.26"/>
    <ellipse cx="1216" cy="604" rx="310" ry="12" opacity="0.22"/>
  </g>

  <!-- 近景坡地 -->
  <path d="M0 726 C 250 692 452 722 664 714 C 880 706 1060 682 1258 698
           C 1416 710 1518 724 1600 712 L1600 900 L0 900 Z" fill="#5A7462"/>
  <path d="M0 782 C 250 748 448 778 668 770 C 892 762 1058 738 1258 752
           C 1418 762 1520 776 1600 764 L1600 900 L0 900 Z" fill="#3C5346" opacity="0.55"/>

  <!-- 飞鸟 -->
  <g stroke="#5A6F72" fill="none" stroke-width="3.2" stroke-linecap="round" opacity="0.42">
    <path d="M648 336q15-12 30 0M678 336q15-12 30 0"/>
    <path d="M782 300q12-10 24 0M806 300q12-10 24 0"/>
  </g>
</svg>
