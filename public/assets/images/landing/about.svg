<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="拱门与光影插画">
  <defs>
    <linearGradient id="aboutSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE6D6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#aboutSky)"/>

  <!-- 右侧拱门（鼠尾草绿） -->
  <path d="M980 900 L980 300 A270 270 0 0 1 1520 300 L1520 900 Z" fill="#8A9B85" opacity="0.9"/>
  <path d="M1040 900 L1040 312 A210 210 0 0 1 1460 312 L1460 900"
        fill="none" stroke="#F7F3EA" stroke-width="5" opacity="0.5"/>

  <!-- 左侧地平色带（陶土） -->
  <path d="M0 700 Q220 610 470 700 T940 690 L940 900 L0 900 Z" fill="#C4704F" opacity="0.85"/>
  <path d="M0 700 Q220 610 470 700 T940 690" fill="none" stroke="#102956" stroke-width="3" opacity="0.35"/>

  <!-- 赭黄日轮与细环 -->
  <circle cx="520" cy="330" r="118" fill="#D9A441"/>
  <circle cx="520" cy="330" r="168" fill="none" stroke="#102956" stroke-width="2.5" opacity="0.35"/>

  <!-- 深蓝细线构成 -->
  <g fill="none" stroke="#102956" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <path d="M120 800 h260"/>
    <path d="M1180 690 h210"/>
    <path d="M860 170 q60 -34 120 -8"/>
  </g>

  <!-- 枝叶点缀 -->
  <g>
    <path d="M150 520 q80 -70 168 -40" fill="none" stroke="#5F7261" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="212" cy="452" rx="34" ry="14" fill="#8A9B85" transform="rotate(-26 212 452)"/>
    <ellipse cx="300" cy="470" rx="28" ry="12" fill="#C4704F" transform="rotate(12 300 470)"/>
    <ellipse cx="176" cy="486" rx="24" ry="10" fill="#D9A441" transform="rotate(-8 176 486)"/>
  </g>

  <!-- 底部小点 -->
  <circle cx="1310" cy="800" r="8" fill="#C4704F"/>
</svg>
