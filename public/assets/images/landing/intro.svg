<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="拱窗前的书桌、摊开的书与咖啡">
  <defs>
    <linearGradient id="iBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F1E5D0"/>
    </linearGradient>
    <linearGradient id="iArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FAF98"/>
      <stop offset="1" stop-color="#81947C"/>
    </linearGradient>
    <radialGradient id="iGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3C988" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F3C988" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iSun" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#F9E6BC"/>
      <stop offset="0.55" stop-color="#EEC47F"/>
      <stop offset="1" stop-color="#DFA066"/>
    </radialGradient>
    <linearGradient id="iTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D9BC"/>
      <stop offset="1" stop-color="#DCC8A4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#iBg)"/>

  <!-- 拱窗 -->
  <path d="M500 600V276a156 156 0 0 1 312 0v324Z" fill="url(#iArch)"/>
  <path d="M522 600V284a134 134 0 0 1 268 0v316" fill="none" stroke="#FBF6EC" stroke-width="3" opacity="0.35"/>
  <circle cx="656" cy="258" r="70" fill="url(#iSun)"/>
  <circle cx="656" cy="258" r="120" fill="url(#iGlow)"/>

  <!-- 桌面 -->
  <rect y="470" width="900" height="130" fill="url(#iTable)"/>
  <path d="M0 470h900" stroke="#D3BE99" stroke-width="2.5"/>

  <!-- 书与杯子投影 -->
  <ellipse cx="300" cy="474" rx="142" ry="9" fill="#C9B394" opacity="0.3"/>
  <ellipse cx="762" cy="534" rx="56" ry="9" fill="#C9B394" opacity="0.32"/>

  <!-- 摊开的书 -->
  <g transform="translate(0,4)">
    <path d="M148 394L300 376L452 394L452 466L300 448L148 466Z" fill="#C4704F"/>
    <path d="M300 372L156 390L156 456L300 442Z" fill="#FFFDF6"/>
    <path d="M300 372L444 390L444 456L300 442Z" fill="#FFFDF6"/>
    <path d="M300 372V442" stroke="#E6D8C1" stroke-width="2.4"/>
    <g stroke="#DFD0B6" stroke-width="3" stroke-linecap="round">
      <path d="M176 400L266 411M176 418L260 428M176 431L238 438"/>
      <path d="M334 411L424 400M340 428L424 418M362 438L424 431"/>
    </g>
    <path d="M178 390L236 396" stroke="#C4704F" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M364 396L422 390" stroke="#C4704F" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 咖啡 -->
  <g>
    <ellipse cx="548" cy="470" rx="44" ry="8" fill="#E3D3B6"/>
    <path d="M516 408h64v34a32 32 0 0 1-64 0Z" fill="#FFFDF6"/>
    <path d="M580 416c20 0 20 27 0 27" fill="none" stroke="#DCC9A8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="548" cy="408" rx="32" ry="7" fill="#F4E9D4" stroke="#E3D3B6" stroke-width="2"/>
    <g stroke="#D8C6A8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M538 392c6-9 6-15 0-23M558 392c6-9 6-15 0-23"/>
    </g>
  </g>

  <!-- 绿植 -->
  <g>
    <path d="M732 470h60l-9 62h-42Z" fill="#C4704F"/>
    <rect x="726" y="464" width="72" height="13" rx="5" fill="#B4633F"/>
    <ellipse cx="762" cy="470" rx="27" ry="5" fill="#8A5B3E"/>
    <path d="M762 470v-118" stroke="#546B58" stroke-width="4" stroke-linecap="round"/>
    <path d="M762 424c-36-4-56-32-46-56 28 6 46 30 46 56Z" fill="#7C9078"/>
    <path d="M762 396c36-4 56-32 46-56-28 6-46 30-46 56Z" fill="#8A9B85"/>
    <path d="M762 380c-28-6-42-28-34-46 21 5 34 24 34 46Z" fill="#8A9B85"/>
    <path d="M762 356c28-6 42-28 34-46-21 5-34 24-34 46Z" fill="#7C9078"/>
  </g>
</svg>
