  <path d="M522 600V284a134 134 0 0 1 268 0v316" fill="none" stroke="#F7EFE0" stroke-width="3" opacity="0.4"/>
  <circle cx="656" cy="258" r="66" fill="#EDC079"/>

  <!-- 桌面 -->
  <rect y="470" width="900" height="130" fill="#E4D3B5"/>
  <path d="M0 470h900" stroke="#D3BE99" stroke-width="2.5"/>

  <!-- 投影 -->
  <ellipse cx="300" cy="474" rx="132" ry="8" fill="#C9B394" opacity="0.28"/>
  <ellipse cx="762" cy="534" rx="54" ry="8" fill="#C9B394" opacity="0.3"/>

  <!-- 摊开的书 -->
  <g>
    <rect x="170" y="278" width="260" height="192" rx="3" fill="#C4704F"/>
    <rect x="178" y="278" width="122" height="184" fill="#FFFDF6"/>
    <rect x="300" y="278" width="122" height="184" fill="#FFFDF6"/>
