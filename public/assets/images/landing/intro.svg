    <path d="M732 470h60l-9 62h-42Z" fill="#C4704F"/>
    <rect x="726" y="464" width="72" height="13" rx="5" fill="#B4633F"/>
    <ellipse cx="762" cy="470" rx="27" ry="5" fill="#8A5B3E"/>
    <path d="M762 470v-118" stroke="#546B58" stroke-width="4" stroke-linecap="round"/>
    <path d="M762 424c-36-4-56-32-46-56 28 6 46 30 46 56Z" fill="#7C9078"/>
    <path d="M762 396c36-4 56-32 46-56-28 6-46 30-46 56Z" fill="#8A9B85"/>
    <path d="M762 380c-28-6-42-28-34-46 21 5 34 24 34 46Z" fill="#8A9B85"/>
    <path d="M762 356c28-6 42-28 34-46-21 5-34 24-34 46Z" fill="#7C9078"/>
